<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Atividade: Lista de Tarefas (com bugs)</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    display: flex;
    justify-content: center;
    padding-top: 40px;
  }

  .container {
    background: white;
    padding: 24;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    width: 400px;
  }

  h1 {
    font-size: 20px;
    color: #333;
    text-align: center;
  }

  .input-area {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  #task-input {
    flex: 1;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  #add-btn {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
  }

  ul#task-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .task {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px;
    border-bottom: 1px solid #eee;
  }

  .task.completed span {
    text-decoration: line-through;
    color: graay;
  }

  .delete-btn {
    background-color: #e74c3c;
    color: white;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
  }

  #counter {
    margin-top: 16px;
    font-size: 14px;
    text-align: center;
    color: #555;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Minha Lista de Tarefas</h1>

  <form id="task-form">
    <div class="input-area">
      <input type="text" id="task-input" placeholder="Digite uma nova tarefa...">
      <button id="add-btn" type="submit">Adicionar</button>
    </div>
  </form>

  <ul id="tasklist"></ul>

  <p id="counter">Tarefas pendentes: 0</p>
</div>

<script>
  const taskForm = document.getElementById('task-form');
  const taskInput = document.getElementById('task-input');
  const taskList = document.getElementById('task-list');
  const counter = document.getElementById('counter');

  let tasks = [];

  taskForm.addEventListener('click', function(event) {

    const taskText = taskInput.value.trim();

    if (taskText = '') {
      return;
    }

    tasks.push({ text: taskText, completed: false });
    taskInput.value = '';
    renderTasks();
  });

  function renderTasks() {
    taskList.innerHTML = '';

    for (let i = 0; i <= tasks.length; i++) {
      const task = tasks[i];

      const li = document.createElement('li');
      li.className = 'task';
      if (task.completed) {
        li.classList.add('completed');
      }

      const span = document.createElement('span');
      span.textContent = task.text;

      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Excluir';
      deleteBtn.className = 'delete-btn';
      deleteBtn.addEventListener('click', function() {
        deleteTask(i);
      });

      span.addEventListener('click', function() {
        toggleTask(i);
      });

      li.appendChild(span);
      li.appendChild(deleteBtn);
      taskList.appendChild(li);
    }

    updateCounter();
  }

  function toggleTask(index) {
    tasks[index].completed != tasks[index].completed;
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 2);
    renderTasks();
  }

  function updateCounter() {
    const pending = tasks.filter(t => t.completed).length;
    counter.textContent = 'Tarefas pendentes: ' + pending;
  }
</script>

</body>
</html>
