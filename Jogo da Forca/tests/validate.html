<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Validação da Forca</title>
<style>body { font: 15px system-ui; } iframe { border: 0; width: 1280px; height: 900px; } pre { white-space: pre-wrap; }</style>
<h1>Validação da Forca</h1>
<p>Execute por um servidor local. O ranking dos testes é isolado em memória.</p>
<pre id="report">Executando…</pre>
<iframe id="game" src="../index.html" title="Jogo em teste"></iframe>
<script>
const frame = document.getElementById("game");
frame.addEventListener("load", async () => {
  const report = document.getElementById("report");
  const lines = [];
  let failures = 0;
  const w = frame.contentWindow;
  const d = frame.contentDocument;
  const $ = (id) => d.getElementById(id);
  const run = (source) => w.eval(source);
  const assert = (condition, message) => { if (!condition) throw new Error(message); };
  const storage = new Map();
  const memoryStorage = {
    getItem: (key) => storage.get(key) ?? null,
    setItem: (key, value) => storage.set(key, String(value))
  };
  const useStorage = (value) => Object.defineProperty(w, "localStorage", { configurable: true, value });
  const key = (value, options = {}, target = d.body) => target.dispatchEvent(new w.KeyboardEvent("keydown", { key: value, bubbles: true, cancelable: true, ...options }));
  const clickLetter = (letter) => d.querySelector(`[data-letter="${letter}"]`).click();
  const begin = (theme = "geografia", index = 0) => {
    run("closeModal(); lastEntries.clear(); sessionRanking = [];");
    storage.clear();
    useStorage(memoryStorage);
    w.Math.random = () => (index + 0.01) / 6;
    $("themeSelect").value = theme;
    $("playerName").value = "Explorador";
    $("startButton").click();
  };
  const solve = () => run("[...new Set(wordLetters())].forEach((letter) => guessLetter(letter))");
  async function test(name, callback) {
    try { await callback(); lines.push(`PASS: ${name}`); }
    catch (error) { failures++; lines.push(`FAIL: ${name} — ${error.message}`); }
  }
  try {
    useStorage(memoryStorage);
    await test("Estado inicial: 26 letras e cartas desabilitadas", () => {
      assert(d.querySelectorAll(".key:disabled").length === 26, "Teclado inicial");
      assert(["revealButton", "cullButton", "shieldButton"].every((id) => $(id).disabled), "Cartas iniciais");
    });
    await test("Iniciar bloqueia nome/tema e permite teclado físico e virtual", () => {
      begin();
      assert($("themeSelect").disabled && $("playerName").disabled, "Configuração deve ficar bloqueada");
      key("r"); clickLetter("E");
      assert(run("score === 104 && combo === 2 && errors === 0"), "Pontuação e combo");
      assert($("wordDisplay").textContent === "RE_E__", "Todas as ocorrências devem aparecer");
    });
    await test("Tema da rodada permanece consistente mesmo com evento change", () => {
      $("themeSelect").value = "historia";
      $("themeSelect").dispatchEvent(new w.Event("change"));
      assert(run('selectedThemeKey === "geografia"'), "Tema da rodada alterado");
      solve();
      assert(run('loadRanking()[0].theme === "Geografia"'), "Ranking atribuído ao tema errado");
    });
    await test("Repetições, atalhos, composição e digitação em campos são ignorados", () => {
      begin(); key("r"); key("R"); key("e", { repeat: true }); key("e", { ctrlKey: true });
      key("e", { altKey: true }); key("e", { metaKey: true }); key("e", { isComposing: true });
      key("e", {}, $("playerName")); key("1"); key("ArrowLeft");
      assert(run("guessedLetters.size === 1 && score === 48"), "Entrada indevida processada");
    });
    await test("Erro repetido custa uma única tentativa e pontuação não fica negativa", () => {
      begin(); key("z"); key("z");
      assert(run("errors === 1 && score === 0 && combo === 0"), "Erro duplicado");
      assert($("dangerTrack").getAttribute("aria-valuenow") === "1", "Indicador de erros");
      assert(d.querySelectorAll(".part.visible").length === 1, "Boneco não acompanha erros");
    });
    await test("Escudo protege apenas o próximo erro e mantém custo/combo corretos", () => {
      begin(); key("r"); $("shieldButton").click(); key("e"); key("z");
      assert(run("errors === 0 && score === 94 && combo === 0 && !shieldActive"), "Escudo ou custo errado");
      assert(d.querySelector('[data-letter="Z"]').classList.contains("protected"), "Estado visual do escudo");
      key("x"); assert(run("errors === 1 && score === 59"), "Escudo reutilizado");
    });
    await test("Eliminar retira 3 letras ausentes sem erros e não pode ser repetido", () => {
      begin("historia", 2); $("cullButton").click();
      assert(run("guessedLetters.size === 3 && errors === 0 && score === 0"), "Eliminação alterou pontuação");
      assert(run("[...guessedLetters].every((letter) => !wordLetters().includes(letter))"), "Eliminou letra correta");
      assert(d.querySelectorAll(".key.eliminated").length === 3, "Estados das letras eliminadas");
      run("removeWrongLetters()"); assert(run("guessedLetters.size === 3"), "Carta repetida");
    });
    await test("Revelar respeita acentos, não pontua e só pode ser usado uma vez", () => {
      begin("filosofia"); $("revealButton").click();
      assert($("wordDisplay").textContent.startsWith("É"), "Acento perdido");
      assert(run("score === 0 && combo === 0 && guessedLetters.size === 1"), "Revelação pontuou");
      run("revealRandomLetter()"); assert(run("guessedLetters.size === 1"), "Carta repetida");
    });
    await test("Vitória pela carta preserva mensagem final e bloqueia novas jogadas", () => {
      begin("filosofia"); key("t"); key("i"); key("c"); key("a"); $("revealButton").click();
      assert($("message").textContent.startsWith("Vitória"), "Mensagem final sobrescrita");
      assert(!run("gameActive") && run("timerId === null"), "Rodada não encerrou");
      const score = run("score"); key("z"); run("endGame(true)");
      assert(run("score") === score && run("loadRanking().length") === 1, "Resultado duplicado");
      assert(d.querySelectorAll(".key:disabled").length === 26, "Teclado continua ativo");
    });
    await test("Modal mantém foco, aceita Escape e devolve foco ao início", () => {
      assert(d.activeElement === $("playAgainButton"), "Foco inicial do modal");
      assert(d.querySelector(".layout").inert, "Fundo interativo");
      key("Tab", { shiftKey: true }); assert(d.activeElement === $("closeModalButton"), "Shift+Tab");
      key("Tab"); assert(d.activeElement === $("playAgainButton"), "Tab");
      key("Escape"); assert($("resultModal").classList.contains("hidden"), "Escape não fecha");
      assert(d.activeElement === $("startButton") && !d.querySelector(".layout").inert, "Retorno do foco");
    });
    await test("Derrota ocorre no sexto erro e mostra a resposta acentuada", () => {
      begin("historia", 2); const answer = run("selectedEntry.word");
      run("ALPHABET.filter((letter) => !wordLetters().includes(letter)).slice(0, 6).forEach((letter) => guessLetter(letter))");
      assert(run("errors === 6 && !gameActive"), "Limite de erros");
      assert($("wordDisplay").textContent === answer && $("modalText").textContent.includes(answer), "Resposta ausente");
      assert(run("loadRanking().length === 0"), "Derrota entrou no ranking");
      assert(d.querySelectorAll(".part.visible").length === 6, "Boneco incompleto");
    });
    await test("Jogar novamente limpa estados e evita repetir a mesma palavra", () => {
      const previous = run("selectedEntry.word"); $("playAgainButton").click();
      assert(run("selectedEntry.word") !== previous, "Palavra repetida");
      assert(run("gameActive && errors === 0 && score === 0 && combo === 0 && !shieldActive"), "Estado não foi limpo");
      assert(!$("revealButton").disabled && !$("cullButton").disabled && !$("shieldButton").disabled, "Cartas não restauradas");
    });
    await test("Cronômetro final e bônus usam o tempo real decorrido", () => {
      begin("filosofia"); run("startTime = performance.now() - 65000"); solve();
      assert($("hudTime").textContent === "01:05", "Cronômetro desatualizado");
      assert(run("loadRanking()[0].time === 65 && score === 642"), "Bônus incorreto");
    });
    await test("Ranking trata nomes como texto, valida registros e ordena os resultados", () => {
      begin();
      const item = { name: "<b>Nome</b>", theme: "Geografia", time: 20, errors: 0, score: 100 };
      storage.set("forca_ranking_v2", JSON.stringify([null, {}, { ...item, errors: -1 }, { ...item, time: "0" }, item,
        { ...item, name: "Segundo", time: 10, score: 200 }, { ...item, name: "Primeiro", time: 10, score: 300 },
        { ...item, name: "Quarto", errors: 1, time: 1 }]));
      run("renderRanking()");
      assert(!$("rankingList").querySelector("b"), "Nome interpretado como HTML");
      assert($("rankingList").textContent.includes("<b>Nome</b>"), "Nome não foi preservado");
      assert(run('loadRanking().length === 4 && loadRanking()[0].name === "Primeiro" && loadRanking()[3].name === "Quarto"'), "Validação ou ordenação");
      storage.set("forca_ranking_v2", "{quebrado"); assert(run("loadRanking().length === 0"), "JSON inválido");
    });
    await test("Ranking limita os resultados a 15 vitórias", () => {
      begin();
      for (let i = 0; i < 20; i++) run(`saveRanking({ name: "Teste", theme: "História", time: ${i}, errors: 0, score: 100 })`);
      assert(run("loadRanking().length === 15 && loadRanking()[14].time === 14"), "Limite do ranking");
    });
    await test("Armazenamento indisponível não interrompe a vitória", () => {
      begin();
      useStorage({ getItem() { throw new Error("bloqueado"); }, setItem() { throw new Error("bloqueado"); } });
      solve();
      assert(!$("resultModal").classList.contains("hidden") && run("loadRanking().length === 1"), "Vitória perdida");
      assert($("modalText").textContent.includes("apenas nesta sessão"), "Falta aviso de persistência");
    });
    await test("Todas as 24 palavras são solucionáveis, incluindo acentos e cedilha", () => {
      for (const theme of ["historia", "geografia", "sociologia", "filosofia"]) {
        for (let i = 0; i < 6; i++) {
          begin(theme, i);
          const answer = run("selectedEntry.word");
          for (const letter of new Set(answer)) key(letter);
          assert(!run("gameActive") && $("wordDisplay").textContent === answer, `Palavra: ${answer}`);
        }
      }
    });
    await test("Falha de áudio restaura botão e estado acessível", async () => {
      begin();
      $("bgMusic").play = () => Promise.reject(new Error("sem áudio"));
      $("soundToggleButton").click(); await Promise.resolve(); await Promise.resolve();
      assert(!run("soundEnabled") && $("soundToggleButton").getAttribute("aria-pressed") === "false", "Som indica reprodução sem áudio");
    });
    for (const width of [320, 375, 768, 1024, 1440]) {
      await test(`Layout sem cortes horizontais em ${width}px`, async () => {
        begin("filosofia", 5); frame.style.width = `${width}px`;
        await new Promise((resolve) => setTimeout(resolve, 30));
        assert(d.documentElement.scrollWidth <= d.documentElement.clientWidth, `Overflow: ${d.documentElement.scrollWidth}/${d.documentElement.clientWidth}`);
        for (const element of d.querySelectorAll(".key, .card-btn, .letter-tile, .controls input, .controls select")) {
          const box = element.getBoundingClientRect();
          assert(box.left >= 0 && box.right <= width, "Controle fora da tela");
        }
        assert(w.getComputedStyle(d.body).overflowY !== "hidden", "Rolagem bloqueada");
      });
    }
  } catch (error) { failures++; lines.push(`FAIL: Preparação — ${error.message}`); }
  finally {
    try { run("clearInterval(timerId)"); } catch {}
    report.textContent = `${lines.length - failures}/${lines.length} testes passaram.\n${lines.join("\n")}`;
    report.dataset.failures = String(failures);
    document.title = failures ? "FAIL — Forca" : "PASS — Forca";
  }
});
</script>
</html>
